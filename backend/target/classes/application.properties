# AirGuard Application Configuration
spring.application.name=airguard

# Server
server.port=8080
server.servlet.context-path=/api

# H2 Database (dev)
spring.datasource.url=jdbc:h2:file:./airguard-dev;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=airguard
spring.datasource.password=airguard123
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
airguard.jwt.secret=airguard-secret-key-change-in-production-must-be-very-long-and-secure-256bit
airguard.jwt.access-token-expiry=3600000
airguard.jwt.refresh-token-expiry=2592000000

# CORS
airguard.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:5500,http://127.0.0.1:3000

# External APIs
airguard.api.open-meteo.base-url=https://api.open-meteo.com/v1
airguard.api.open-meteo.aqi-url=https://air-quality-api.open-meteo.com/v1
airguard.api.open-meteo.geocoding-url=https://geocoding-api.open-meteo.com/v1
airguard.api.nominatim.url=https://nominatim.openstreetmap.org
airguard.api.waqi.url=https://api.waqi.info

# Cache TTL (seconds)
airguard.cache.aqi-ttl=900

# Logging
logging.level.com.airguard=INFO
logging.level.org.springframework.security=WARN
