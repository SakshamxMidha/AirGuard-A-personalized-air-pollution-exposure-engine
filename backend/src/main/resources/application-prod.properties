# Production overrides — set via environment variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/airguard}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:airguard}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
airguard.jwt.secret=${JWT_SECRET}
airguard.cors.allowed-origins=${ALLOWED_ORIGINS:https://yourdomain.com}
logging.level.com.airguard=WARN
