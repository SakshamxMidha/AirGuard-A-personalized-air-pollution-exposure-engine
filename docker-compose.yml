version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airguard-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://db:5432/airguard
      - DB_USER=airguard
      - DB_PASSWORD=${DB_PASSWORD:-airguard_secure_pass}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-very-long-random-secret-key-256bit}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - airguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airguard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - airguard-net

  db:
    image: postgres:16-alpine
    container_name: airguard-db
    environment:
      POSTGRES_DB: airguard
      POSTGRES_USER: airguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-airguard_secure_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - airguard-net

volumes:
  pgdata:

networks:
  airguard-net:
    driver: bridge
